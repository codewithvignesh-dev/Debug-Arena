<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Debug Arena{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
body{background:#060912;color:#e6eaf7;font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.grid-bg{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(99,120,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(99,120,255,.09) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 30%,transparent 78%);mask-image:radial-gradient(ellipse at 50% 25%,#000 30%,transparent 78%)}
.glow{position:fixed;z-index:-1;top:-140px;left:50%;width:640px;height:340px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(99,102,241,.35),transparent);filter:blur(30px)}
.glass{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(14px);border-radius:1rem}
.inp{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);border-radius:.75rem;padding:.75rem 1rem;outline:none}
.inp:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.25)}
.btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:.75rem;padding:.7rem 1.25rem;font-weight:700;transition:.15s}
.btn:hover{filter:brightness(1.15)}.btn:focus-visible{outline:2px solid #c7d2fe;outline-offset:2px}
</style></head><body><div class="grid-bg"></div><div class="glow"></div>{% block body %}{% endblock %}</body></html>
